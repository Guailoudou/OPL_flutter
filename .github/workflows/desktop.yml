name: Desktop builds

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.4'
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze --no-pub
      - run: flutter test --no-pub
      - run: flutter test --no-pub --platform chrome test/config_browser_test.dart
      - run: flutter build web --release --no-pub
      - name: Upload Web build
        uses: actions/upload-artifact@v4
        with:
          name: opl-web
          path: build/web/
          if-no-files-found: error
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            server/package-lock.json
            server/admin/package-lock.json
      - run: npm ci && npm test && npm run build
        working-directory: server
      - run: npm ci && npm run build
        working-directory: server/admin

  build:
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-2022
            platform: windows
            arch: x64
          - runner: ubuntu-24.04
            platform: linux
            arch: x64
          - runner: ubuntu-24.04-arm
            platform: linux
            arch: arm64
          - runner: macos-15-intel
            platform: macos
            arch: x64
          - runner: macos-15
            platform: macos
            arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.4'
          # Linux arm64 has engine artifacts but no prebuilt stable SDK archive.
          # master mode clones Flutter, then checks out the same pinned release tag.
          channel: ${{ matrix.platform == 'linux' && matrix.arch == 'arm64' && 'master' || 'stable' }}
          architecture: ${{ matrix.arch }}
          cache: true
      - uses: actions/setup-go@v5
        with:
          go-version: '1.20.14'
          cache-dependency-path: third_party/openp2p/go.sum
      - name: Install Linux desktop dependencies
        if: matrix.platform == 'linux'
        run: sudo apt-get update && sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev libayatana-appindicator3-dev libstdc++-12-dev
      - name: Build and package application and OpenP2P
        run: python scripts/build_desktop.py --arch ${{ matrix.arch }}
      - name: Upload desktop package
        uses: actions/upload-artifact@v4
        with:
          name: opl-${{ matrix.platform }}-${{ matrix.arch }}
          path: dist/opl-${{ matrix.platform }}-${{ matrix.arch }}.*
          if-no-files-found: error
          compression-level: 0
      - name: Verify iOS interface and configuration build
        if: matrix.platform == 'macos' && matrix.arch == 'arm64'
        run: flutter build ios --release --no-codesign
